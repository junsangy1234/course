<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코스 중심지 · 장소 추천 테스트</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif; color: #202635; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 20px 72px; }
    main { max-width: 1080px; margin: 0 auto; }
    h1 { margin: 0; font-size: 30px; letter-spacing: -.8px; }
    h2 { margin: 0; font-size: 19px; }
    h3 { margin: 0; font-size: 17px; }
    .lead, .hint, .meta { color: #687186; line-height: 1.6; }
    .lead { margin: 10px 0 26px; }
    .panel { margin-top: 18px; padding: 22px; border: 1px solid #e3e8f1; border-radius: 16px; background: #fff; box-shadow: 0 5px 18px rgba(32,52,87,.04); }
    .step { display: inline-flex; align-items: center; justify-content: center; width: 25px; height: 25px; margin-right: 8px; border-radius: 50%; background: #2864dc; color: white; font-size: 13px; font-weight: 800; }
    .region { display: flex; gap: 10px; max-width: 360px; margin: 18px 0; }
    input { min-width: 0; width: 100%; padding: 11px 12px; border: 1px solid #d7deea; border-radius: 10px; color: #202635; font: inherit; }
    .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-top: 16px; }
    .group { padding: 15px; border: 1px solid #e5e9f1; border-radius: 12px; background: #fbfcfe; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
    .chip input { position: absolute; opacity: 0; pointer-events: none; }
    .chip span { display: block; padding: 8px 11px; border: 1px solid #d9dfeb; border-radius: 999px; background: #fff; color: #566176; cursor: pointer; font-size: 14px; }
    .chip input:checked + span { border-color: #2864dc; background: #edf3ff; color: #1e57c7; font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }
    button { border: 0; border-radius: 10px; padding: 11px 15px; background: #2864dc; color: #fff; cursor: pointer; font: inherit; font-weight: 700; }
    button.secondary { background: #edf1f8; color: #40506c; }
    button:disabled { opacity: .55; cursor: default; }
    #status { margin: 14px 0 0; color: #687186; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 12px; margin-top: 16px; }
    .card { padding: 17px; border: 1px solid #e2e7f0; border-radius: 13px; background: #fff; }
    .selectable { cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s; }
    .selectable:hover { transform: translateY(-2px); border-color: #94b7ff; }
    .selected { border-color: #2864dc; box-shadow: 0 0 0 3px rgba(40,100,220,.12); }
    .badge { display: inline-block; margin: 10px 0; padding: 5px 9px; border-radius: 999px; background: #edf3ff; color: #235ac9; font-size: 13px; font-weight: 750; }
    .place-name { font-size: 17px; font-weight: 750; }
    .breakdown { margin-top: 12px; padding-top: 11px; border-top: 1px solid #edf0f5; color: #596478; font-size: 13px; line-height: 1.6; }
    a { color: #2864dc; text-decoration: none; font-size: 13px; font-weight: 650; }
    .empty { color: #687186; }
    .selection-summary { margin: 8px 0 0; color: #40506c; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>코스 중심지 · 장소 추천 테스트</h1>
  <p class="lead">선호도를 선택하면 코스 중심지(AREA/HUB)를 추천하고, 중심지를 고른 뒤 활동과 실제 장소를 순서대로 추천합니다.</p>

  <section class="panel">
    <h2><span class="step">1</span>지역과 선호도 선택</h2>
    <p class="hint">선호도는 건너뛸 수 있습니다. 건너뛰면 해당 지역의 기본 중심지를 보여줍니다.</p>
    <label class="region">상위 지역<input id="region-name" value="서울" maxlength="100"></label>
    <div id="groups" class="groups"></div>
    <div class="actions">
      <button id="anchor-button">코스 중심지 추천</button>
      <button id="skip-button" class="secondary">선호도 없이 추천</button>
    </div>
    <p id="status">선호도 선택지를 불러오는 중입니다.</p>
  </section>

  <section id="anchor-section" class="panel" hidden>
    <h2><span class="step">2</span>어디를 중심으로 둘까요?</h2>
    <p id="anchor-hint" class="hint"></p>
    <div id="anchors" class="grid"></div>
  </section>

  <section id="activity-section" class="panel" hidden>
    <h2><span class="step">3</span>무엇을 할까요?</h2>
    <p id="activity-hint" class="hint"></p>
    <div id="activities" class="grid"></div>
    <div class="actions"><button id="auto-place-button" class="secondary">가장 어울리는 활동으로 바로 장소 추천</button></div>
  </section>

  <section id="place-section" class="panel" hidden>
    <h2><span class="step">4</span>추천 장소</h2>
    <p id="place-hint" class="hint"></p>
    <div id="places" class="grid"></div>
  </section>
</main>

<script>
  const recommendationApi = '/api/recommendations';
  const courseAnchorApi = '/api/course-anchors/recommendations';
  const groupsElement = document.getElementById('groups');
  const statusElement = document.getElementById('status');
  const anchorSection = document.getElementById('anchor-section');
  const anchorsElement = document.getElementById('anchors');
  const activitySection = document.getElementById('activity-section');
  const activitiesElement = document.getElementById('activities');
  const placeSection = document.getElementById('place-section');
  const placesElement = document.getElementById('places');
  let recommendationResult;
  let selectedAnchor;
  let activePreferenceOptionIds = [];

  const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);

  function selectedOptionIds() {
    return [...document.querySelectorAll('.preference-input:checked')].map(input => Number(input.value));
  }

  function renderGroups(config) {
    groupsElement.replaceChildren();
    config.preferenceGroups.forEach(group => {
      const section = document.createElement('section');
      section.className = 'group';
      section.innerHTML = `<h3>${escapeHtml(group.name)}</h3><p class="hint">${group.allowsMultipleSelection ? '복수 선택 가능' : '하나 선택 가능'} · 건너뛰기 가능</p>`;
      const chips = document.createElement('div');
      chips.className = 'chips';
      group.options.forEach(option => {
        const label = document.createElement('label');
        label.className = 'chip';
        const input = document.createElement('input');
        input.className = 'preference-input';
        input.type = group.allowsMultipleSelection ? 'checkbox' : 'radio';
        input.name = `group-${group.id}`;
        input.value = option.id;
        const text = document.createElement('span');
        text.textContent = option.name;
        label.append(input, text);
        chips.append(label);
      });
      section.append(chips);
      groupsElement.append(section);
    });
  }

  async function getJson(response, fallbackMessage) {
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.message || fallbackMessage);
    return body;
  }

  async function recommendAnchors(ignorePreferences) {
    const regionName = document.getElementById('region-name').value.trim();
    if (!regionName) { statusElement.textContent = '상위 지역을 입력해 주세요.'; return; }
    const preferenceOptionIds = ignorePreferences ? [] : selectedOptionIds();
    activePreferenceOptionIds = preferenceOptionIds;
    statusElement.textContent = '코스 중심지를 계산 중입니다.';
    document.getElementById('anchor-button').disabled = true;
    try {
      recommendationResult = await getJson(await fetch(courseAnchorApi, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ regionName, preferenceOptionIds, size: 5 })
      }), '코스 중심지를 추천하지 못했습니다.');
      selectedAnchor = null;
      renderAnchors(recommendationResult.courseAnchors, preferenceOptionIds.length === 0);
      activitySection.hidden = true;
      placeSection.hidden = true;
      statusElement.textContent = '코스 중심지를 선택해 주세요.';
    } catch (error) {
      anchorSection.hidden = true;
      statusElement.textContent = error.message;
    } finally {
      document.getElementById('anchor-button').disabled = false;
    }
  }

  function renderAnchors(anchors, noPreference) {
    anchorSection.hidden = false;
    document.getElementById('anchor-hint').textContent = noPreference
      ? '선호도 없이 기본 노출 순서로 추천한 중심지입니다.'
      : '선호도 점수와 활동 적합도를 합산한 중심지입니다.';
    anchorsElement.replaceChildren();
    anchors.forEach(anchor => {
      const card = document.createElement('article');
      card.className = 'card selectable';
      card.innerHTML = `<h3>${escapeHtml(anchor.name)} <small>(${escapeHtml(anchor.type)})</small></h3><span class="badge">${anchor.rank}위 · 최종 ${anchor.finalScore}점</span><p class="meta">${escapeHtml(anchor.description)}<br>검색 반경 ${anchor.radiusMeters.toLocaleString()}m</p><div class="breakdown">직접 선호도 ${anchor.directPreferenceScore}점 + 활동 기반 ${anchor.activityBasedScore}점</div>`;
      card.addEventListener('click', () => selectAnchor(anchor, card));
      anchorsElement.append(card);
    });
  }

  function selectAnchor(anchor, card) {
    selectedAnchor = anchor;
    [...anchorsElement.children].forEach(element => element.classList.remove('selected'));
    card.classList.add('selected');
    renderActivities(recommendationResult.activityScores);
    statusElement.textContent = `${anchor.name}을(를) 중심지로 선택했습니다. 활동을 골라 주세요.`;
  }

  function renderActivities(activities) {
    activitySection.hidden = false;
    placeSection.hidden = true;
    document.getElementById('activity-hint').textContent = `${selectedAnchor.name} 기준으로 어울리는 활동입니다.`;
    activitiesElement.replaceChildren();
    activities.slice(0, 5).forEach(activity => {
      const card = document.createElement('article');
      card.className = 'card selectable';
      card.innerHTML = `<h3>${escapeHtml(activity.name)}</h3><span class="badge">활동 점수 ${activity.score}점</span><p class="meta">이 활동의 실제 장소 후보를 검색합니다.</p>`;
      card.addEventListener('click', () => recommendPlaces(activity, card));
      activitiesElement.append(card);
    });
  }

  async function recommendPlaces(activity, card) {
    if (!selectedAnchor) return;
    [...activitiesElement.children].forEach(element => element.classList.remove('selected'));
    if (card) card.classList.add('selected');
    placeSection.hidden = false;
    placesElement.innerHTML = '<p class="empty">카카오에서 장소 후보를 검색 중입니다.</p>';
    document.getElementById('place-hint').textContent = `${selectedAnchor.name} · ${activity.name}`;
    statusElement.textContent = '중심지 좌표와 반경으로 장소를 검색 중입니다.';
    try {
      const result = await getJson(await fetch(`${recommendationApi}/places`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          activityCategoryId: activity.activityCategoryId,
          preferenceOptionIds: activePreferenceOptionIds,
          latitude: selectedAnchor.latitude,
          longitude: selectedAnchor.longitude,
          radius: selectedAnchor.radiusMeters
        })
      }), '장소를 추천하지 못했습니다.');
      renderPlaces(result.places);
      statusElement.textContent = '장소 추천을 완료했습니다.';
    } catch (error) {
      placesElement.innerHTML = `<p class="empty">${escapeHtml(error.message)}</p>`;
      statusElement.textContent = error.message;
    }
  }

  function renderPlaces(places) {
    placesElement.replaceChildren();
    if (!places.length) {
      placesElement.innerHTML = '<p class="empty">추천할 장소를 찾지 못했습니다. 다른 활동이나 중심지를 선택해 보세요.</p>';
      return;
    }
    places.forEach((place, index) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `<span class="badge">${index + 1}위 · 최종 ${place.finalScore}점</span><div class="place-name">${escapeHtml(place.name)}</div><p class="meta">${escapeHtml(place.categoryName)}<br>${escapeHtml(place.roadAddressName || place.addressName)}</p><div class="breakdown">활동 적합도 ${place.activityScore}점 + 거리 점수 ${place.distanceScore}점${place.distanceMeters == null ? '' : ` (${place.distanceMeters}m)`}</div>${place.placeUrl ? `<p><a href="${escapeHtml(place.placeUrl)}" target="_blank" rel="noreferrer">카카오맵에서 보기 →</a></p>` : ''}`;
      placesElement.append(card);
    });
  }

  document.getElementById('anchor-button').addEventListener('click', () => recommendAnchors(false));
  document.getElementById('skip-button').addEventListener('click', () => recommendAnchors(true));
  document.getElementById('auto-place-button').addEventListener('click', () => {
    const firstActivity = recommendationResult?.activityScores?.[0];
    if (firstActivity) recommendPlaces(firstActivity);
  });

  (async () => {
    try {
      const config = await getJson(await fetch(`${recommendationApi}/config`), '선호도 선택지를 불러오지 못했습니다.');
      renderGroups(config);
      statusElement.textContent = '선호도를 고른 뒤 코스 중심지 추천을 눌러보세요.';
    } catch (error) {
      statusElement.textContent = error.message;
    }
  })();
</script>
</body>
</html>
